# Compiles every milestone sketch for the M5Stack Fire (M5Stack board package),
# so a library update or a slip in one sketch shows up on the next push.
name: Compile sketches

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: m5stack:esp32:m5stack_fire
          platforms: |
            - name: m5stack:esp32
              source-url: https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          libraries: |
            - name: M5Unified
            - name: M5GFX
            - name: Adafruit VL53L0X
            - name: Adafruit BMP280 Library
          sketch-paths: |
            - firmware
